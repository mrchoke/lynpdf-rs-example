[package]
name = "lynpdf-rs-example"
version = "0.1.1"
edition = "2021"
description = "Example shop checkout app that generates receipt PDFs with lynpdf-rs"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["form"] }
chrono = { version = "0.4", default-features = true }
lynpdf-rs = { version = "0.1.0"}
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
